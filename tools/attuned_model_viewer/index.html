<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Attuned Model Viewer</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #101116;
        --panel: rgba(20, 22, 29, 0.88);
        --panel-strong: rgba(27, 30, 39, 0.96);
        --line: rgba(228, 232, 241, 0.14);
        --text: #f1efe8;
        --muted: #a8adba;
        --cyan: #61dce6;
        --gold: #d8bd72;
        --violet: #9e72da;
        --danger: #ef7f7f;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .app {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 336px;
        height: 100%;
        min-height: 0;
      }

      .stage {
        position: relative;
        min-width: 0;
        min-height: 0;
        background:
          radial-gradient(circle at 58% 36%, rgba(97, 220, 230, 0.12), transparent 30%),
          linear-gradient(145deg, #11151c 0%, #090a0d 100%);
      }

      #viewer {
        display: block;
        width: 100%;
        height: 100%;
      }

      .hud {
        position: absolute;
        left: 18px;
        bottom: 18px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        max-width: calc(100% - 36px);
        pointer-events: none;
      }

      .pill {
        border: 1px solid var(--line);
        background: rgba(8, 9, 12, 0.64);
        color: var(--muted);
        padding: 7px 10px;
        font-size: 12px;
        line-height: 1;
        backdrop-filter: blur(10px);
      }

      aside {
        min-height: 0;
        overflow: auto;
        border-left: 1px solid var(--line);
        background:
          linear-gradient(180deg, rgba(32, 34, 42, 0.96), rgba(12, 13, 17, 0.97)),
          var(--panel-strong);
      }

      .panel {
        padding: 18px;
        border-bottom: 1px solid var(--line);
      }

      h1,
      h2 {
        margin: 0;
        letter-spacing: 0;
      }

      h1 {
        font-size: 18px;
        font-weight: 760;
      }

      h2 {
        margin-bottom: 12px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 720;
        text-transform: uppercase;
      }

      .title-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .status-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--gold);
        box-shadow: 0 0 16px rgba(216, 189, 114, 0.68);
      }

      .status-dot.ready {
        background: var(--cyan);
        box-shadow: 0 0 16px rgba(97, 220, 230, 0.68);
      }

      .status-dot.error {
        background: var(--danger);
        box-shadow: 0 0 16px rgba(239, 127, 127, 0.58);
      }

      label {
        display: grid;
        gap: 7px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 660;
      }

      select,
      button {
        min-height: 38px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: rgba(9, 10, 14, 0.76);
        color: var(--text);
        font: inherit;
      }

      select {
        width: 100%;
        padding: 0 10px;
      }

      button {
        cursor: pointer;
        padding: 0 12px;
      }

      button:hover,
      select:hover {
        border-color: rgba(97, 220, 230, 0.44);
      }

      button.active {
        border-color: rgba(97, 220, 230, 0.7);
        background: rgba(40, 83, 91, 0.42);
        color: #eafcff;
      }

      .button-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .segmented {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 5px;
        background: rgba(7, 8, 11, 0.56);
      }

      .segmented button {
        min-height: 32px;
        border-radius: 5px;
      }

      .metric-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .metric {
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 10px;
        background: rgba(9, 10, 14, 0.5);
      }

      .metric span {
        display: block;
        color: var(--muted);
        font-size: 11px;
      }

      .metric strong {
        display: block;
        margin-top: 4px;
        color: var(--text);
        font-size: 18px;
      }

      .texture-list {
        display: grid;
        gap: 8px;
      }

      .texture-row {
        display: grid;
        grid-template-columns: 42px 1fr;
        gap: 9px;
        align-items: center;
        min-width: 0;
      }

      .texture-row img {
        width: 42px;
        height: 42px;
        border: 1px solid var(--line);
        background: #07080b;
        image-rendering: pixelated;
        object-fit: cover;
      }

      .texture-row code {
        min-width: 0;
        overflow: hidden;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.35;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .log {
        margin: 0;
        max-height: 190px;
        overflow: auto;
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
        font-size: 11px;
        line-height: 1.5;
        white-space: pre-wrap;
      }

      .log.error {
        color: #ffc5c5;
      }

      @media (max-width: 860px) {
        .app {
          grid-template-columns: 1fr;
          grid-template-rows: minmax(0, 1fr) auto;
        }

        aside {
          max-height: 45vh;
          border-left: 0;
          border-top: 1px solid var(--line);
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="stage" aria-label="3D model viewport">
        <canvas id="viewer"></canvas>
        <div class="hud" aria-live="polite">
          <span class="pill" id="cameraHud">Camera ready</span>
          <span class="pill" id="assetHud">Loading assets</span>
        </div>
      </section>

      <aside>
        <section class="panel">
          <div class="title-row">
            <h1>Attuned Model Viewer</h1>
            <span class="status-dot" id="statusDot"></span>
          </div>
        </section>

        <section class="panel">
          <h2>Model</h2>
          <label>
            Selection
            <select id="modelSelect"></select>
          </label>
        </section>

        <section class="panel">
          <h2>Layout</h2>
          <div class="segmented" role="group" aria-label="Viewer layout">
            <button id="singleMode" type="button">Single</button>
            <button id="pairMode" type="button" class="active">Pair</button>
          </div>
        </section>

        <section class="panel">
          <h2>Tools</h2>
          <div class="button-row">
            <button id="resetCamera" type="button">Reset</button>
            <button id="saveShot" type="button">Shot</button>
          </div>
        </section>

        <section class="panel">
          <h2>Stats</h2>
          <div class="metric-grid">
            <div class="metric"><span>Elements</span><strong id="elementCount">0</strong></div>
            <div class="metric"><span>Faces</span><strong id="faceCount">0</strong></div>
            <div class="metric"><span>Textures</span><strong id="textureCount">0</strong></div>
            <div class="metric"><span>Scale</span><strong id="scaleReadout">1.00</strong></div>
          </div>
        </section>

        <section class="panel">
          <h2>Textures</h2>
          <div class="texture-list" id="textureList"></div>
        </section>

        <section class="panel">
          <h2>Diagnostics</h2>
          <pre class="log" id="diagnostics">Waiting for first render...</pre>
        </section>
      </aside>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="./model-viewer.js"></script>
  </body>
</html>
