plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id 'com.modrinth.minotaur' version '2.+'
}

version = project.mod_version
group = project.maven_group

repositories {
	// Loom adds the Minecraft/Fabric repositories automatically; Maven Central
	// is declared here for ordinary library dependencies such as JUnit.
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"attuned" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// JUnit 5 — unit tests for the Minecraft-free logic (run by the `test` task).
	testImplementation platform("org.junit:junit-bom:5.11.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

test {
	useJUnitPlatform()
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

// Modrinth publishing. Run `./gradlew modrinth` with a MODRINTH_TOKEN environment
// variable set; the Modrinth project must already exist under the slug below.
modrinth {
	token = providers.environmentVariable("MODRINTH_TOKEN")
	projectId = "attuned-mod"
	versionNumber = project.version
	versionType = "release"
	versionName = "Attuned ${project.version}"
	// Changelog for the current release — refresh this each time mod_version bumps.
	changelog = """\
The Pacts Update.

- Pacts: named set bonuses that wake when you commit to an affinity. Pyresworn ignites foes on melee. Stoneheart dampens incoming damage. Windrunner makes you sprint faster and step over short rises. Untethered amplifies your hits against any affinity-bearing foe and paints an impact sparkle.
- Resonance: a new combat gauge that fills as you fight matchup-favored foes and drains when neutralized hits land. Apex capstones only fire while resonance is at or above the half-full threshold.
- Combat HUD: an affinity gem and resonance bar above the hotbar. The gem glows gold when empowered against the foe you are aiming at, dims red when neutralized. Each affinity has its own glyph (flame, shield, wing) so you read at a glance.
- Altar GUI: right-click the Attunement Altar empty-handed to open a clean shard-binding screen with a stance-tinted well, corner brackets, accent line, and a Bind button.
- Altar overhaul: a fresh 3D model with affinity-themed crystals, four animated variants per stance, and a converging-particle bind animation.
- New art for every original Focus and the Attunement Shard.
- Pact-themed death messages: be undone by a Pyresworn, shattered by a Stoneheart, outpaced by a Windrunner, unmade by an Untethered. Toggle via attuned.json.
- Onboarding: short one-time hints on first shard pickup, first altar interaction, and first altar approach so new players know where to go.
- First-pact fanfare the first time you wake each pact on a character.
- /attuned status: a debug command that prints your active foci, pact, resonance, and apex state.
- A long list of polish and fixes: resonance persists across death, locale-safe lang keys, cached per-frame HUD lookups, altar GUI auto-closes on walk-away or dimension change, Pyresworn now respects PvP and friendly-fire rules, Apex Execute no longer triggers on damage-over-time, and much more.
"""
	uploadFile = file("build/libs/${project.name}-${project.version}.jar")
	gameVersions = ["26.1.2"]
	loaders = ["fabric"]
	dependencies {
		required.project "fabric-api"
	}
}

// `./gradlew modrinth` builds the remapped jar first, then uploads it.
tasks.named("modrinth") {
	dependsOn tasks.named("build")
}
