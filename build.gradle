plugins {
	id 'net.neoforged.moddev' version "${moddevgradle_version}"
	id 'maven-publish'
	id 'com.modrinth.minotaur' version '2.9.0'
}

version = project.mod_version
group = project.maven_group
def targetJavaVersion = project.java_version.toString().toInteger()

String currentChangelogSection(String changelog, String releaseVersion) {
	def lines = changelog.readLines()
	def headingPrefix = "## Attuned ${releaseVersion}"
	int start = lines.findIndexOf { it == headingPrefix || it.startsWith(headingPrefix + " ") }
	if (start < 0) {
		throw new GradleException("CHANGELOG.md is missing an Attuned ${releaseVersion} section")
	}
	int end = lines.findIndexOf(start + 1) { it.startsWith("## ") }
	if (end < 0) {
		end = lines.size()
	}
	String section = lines.subList(start, end).join(System.lineSeparator()).trim()
	if (section.readLines().drop(1).every { it.trim().isEmpty() }) {
		throw new GradleException("CHANGELOG.md Attuned ${releaseVersion} section is empty")
	}
	return section
}

repositories {
	maven {
		name = 'NeoForge'
		url = 'https://maven.neoforged.net/releases'
	}
	mavenCentral()
}

dependencyLocking {
	lockAllConfigurations()
}

sourceSets {
	client {
		java.setSrcDirs(['src/client/java'])
		resources.setSrcDirs(['src/client/resources'])
		compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
		runtimeClasspath += output + compileClasspath
	}
	test {
		compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
		runtimeClasspath += output + compileClasspath
	}
}

neoForge {
	version = project.neo_version
	validateAccessTransformers = true

	runs {
		client {
			client()
		}
		server {
			server()
		}
		data {
			data()
		}
	}

	mods {
		"attuned" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// JUnit 5 - unit tests for the Minecraft-free logic (run by the `test` task).
	testImplementation platform("org.junit:junit-bom:5.11.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("META-INF/neoforge.mods.toml") {
		expand([
			"mod_id": project.mod_id,
			"mod_name": project.mod_name,
			"mod_license": project.mod_license,
			"mod_version": version,
			"mod_group_id": project.mod_group_id,
			"mod_authors": project.mod_authors,
			"mod_description": project.mod_description,
			"loader_version_range": project.loader_version_range,
			"minecraft_version_range": project.minecraft_version_range,
			"neoforge_version_range": project.neoforge_version_range,
			"java_version": targetJavaVersion.toString()
		])
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = targetJavaVersion
}

test {
	useJUnitPlatform()
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(targetJavaVersion)
	}

	withSourcesJar()

	sourceCompatibility = JavaVersion.toVersion(targetJavaVersion)
	targetCompatibility = JavaVersion.toVersion(targetJavaVersion)
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}

modrinth {
	token = providers.environmentVariable("MODRINTH_TOKEN")
	projectId = "attuned-mod"
	versionNumber = project.version
	versionType = "release"
	versionName = "Attuned ${project.version}"
	def changelogFile = layout.projectDirectory.file("CHANGELOG.md")
	changelog = providers.provider {
		currentChangelogSection(changelogFile.asFile.getText("UTF-8"), project.version.toString())
	}.get()
	uploadFile = file("build/libs/${project.name}-${project.version}.jar")
	gameVersions = [project.minecraft_version.toString()]
	loaders = ["neoforge"]
}

tasks.named("modrinth") {
	dependsOn tasks.named("build")
}
