plugins {
	id 'java'
	id 'idea'
	id 'eclipse'
	id 'net.minecraftforge.gradle' version '7.0.29'
	id 'maven-publish'
	id 'com.modrinth.minotaur' version '2.9.0'
}

version = project.mod_version
group = project.maven_group
def targetJavaVersion = project.java_version.toString().toInteger()
def modId = project.mod_id.toString()

String currentChangelogSection(String changelog, String releaseVersion) {
	def lines = changelog.readLines()
	def headingPrefix = "## Attuned ${releaseVersion}"
	int start = lines.findIndexOf { it == headingPrefix || it.startsWith(headingPrefix + " ") }
	if (start < 0) {
		throw new GradleException("CHANGELOG.md is missing an Attuned ${releaseVersion} section")
	}
	int end = lines.findIndexOf(start + 1) { it.startsWith("## ") }
	if (end < 0) {
		end = lines.size()
	}
	String section = lines.subList(start, end).join(System.lineSeparator()).trim()
	if (section.readLines().drop(1).every { it.trim().isEmpty() }) {
		throw new GradleException("CHANGELOG.md Attuned ${releaseVersion} section is empty")
	}
	return section
}

repositories {
	minecraft.mavenizer(it)
	maven fg.forgeMaven
	maven fg.minecraftLibsMaven
	mavenCentral()
}

sourceSets {
	main {
		java.srcDir "src/client/java"
		resources.srcDir "src/client/resources"
		resources.srcDir "src/generated/resources"
	}
}

minecraft {
	runs {
		configureEach {
			workingDir = layout.projectDirectory.dir("run")
			systemProperty "eventbus.api.strictRuntimeChecks", "true"
			systemProperty "forge.enabledGameTestNamespaces", modId
			mods {
				"${modId}" {
					source sourceSets.main
				}
			}
		}

		register("client")

		register("server") {
			args "--nogui"
		}

		register("gameTestServer")

		register("data") {
			workingDir = layout.projectDirectory.dir("run-data")
			args "--mod", modId, "--all", "--output", layout.projectDirectory.dir("src/generated/resources"), "--existing", layout.projectDirectory.dir("src/main/resources")
		}
	}
}

dependencies {
	implementation minecraft.dependency("net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}")
	annotationProcessor "net.minecraftforge:eventbus-validator:7.0.1"

	// JUnit 5 for Minecraft-free contract tests.
	testImplementation platform("org.junit:junit-bom:5.11.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	def replaceProperties = [
		minecraft_version: project.minecraft_version,
		minecraft_version_range: project.minecraft_version_range,
		forge_version: project.forge_version,
		forge_version_range: project.forge_version_range,
		loader_version_range: project.loader_version_range,
		mod_id: project.mod_id,
		mod_name: project.mod_name,
		mod_license: project.mod_license,
		mod_version: project.mod_version,
		mod_authors: project.mod_authors,
		mod_description: project.mod_description
	]
	inputs.properties replaceProperties

	exclude "assets/attuned/blockbench/**"
	exclude "assets/attuned/textures/item/ocean_relic_trident_blockbench.png"
	exclude "assets/attuned/textures/item/ocean_relic_trident_blockbench.png.mcmeta"
	exclude "fabric.mod.json"

	filesMatching(["META-INF/mods.toml", "pack.mcmeta"]) {
		expand replaceProperties + [project: project]
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = targetJavaVersion
}

test {
	useJUnitPlatform()
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(targetJavaVersion)
	}

	withSourcesJar()

	sourceCompatibility = JavaVersion.toVersion(targetJavaVersion)
	targetCompatibility = JavaVersion.toVersion(targetJavaVersion)
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}

	manifest {
		attributes([
			"Specification-Title": modId,
			"Specification-Vendor": project.mod_authors,
			"Specification-Version": "1",
			"Implementation-Title": project.name,
			"Implementation-Version": project.jar.archiveVersion,
			"Implementation-Vendor": project.mod_authors,
			"Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
			"MixinConfigs": "attuned.mixins.json,attuned.client.mixins.json"
		])
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

// Modrinth publishing. Run `./gradlew modrinth` with a MODRINTH_TOKEN environment
// variable set; the Modrinth project must already exist under the slug below.
modrinth {
	token = providers.environmentVariable("MODRINTH_TOKEN")
	projectId = "attuned-mod"
	versionNumber = project.version
	versionType = "release"
	versionName = "Forge: Minecraft ${project.minecraft_version} - Attuned ${project.version}"
	def changelogFile = layout.projectDirectory.file("CHANGELOG.md")
	changelog = providers.provider {
		currentChangelogSection(changelogFile.asFile.getText("UTF-8"), project.version.toString())
	}.get()
	uploadFile = file("build/libs/${project.name}-${project.version}.jar")
	gameVersions = [project.minecraft_version.toString()]
	loaders = ["forge"]
}

// `./gradlew modrinth` builds the remapped jar first, then uploads it.
tasks.named("modrinth") {
	dependsOn tasks.named("build")
}
