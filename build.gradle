plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id 'com.modrinth.minotaur' version '2.+'
}

version = project.mod_version
group = project.maven_group

repositories {
	// Loom adds the Minecraft/Fabric repositories automatically; Maven Central
	// is declared here for ordinary library dependencies such as JUnit.
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"attuned" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// JUnit 5 — unit tests for the Minecraft-free logic (run by the `test` task).
	testImplementation platform("org.junit:junit-bom:5.11.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

test {
	useJUnitPlatform()
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

// Modrinth publishing. Run `./gradlew modrinth` with a MODRINTH_TOKEN environment
// variable set; the Modrinth project must already exist under the slug below.
modrinth {
	token = providers.environmentVariable("MODRINTH_TOKEN")
	projectId = "attuned-mod"
	versionNumber = project.version
	versionType = "release"
	versionName = "Attuned ${project.version}"
	// Changelog for the current release — refresh this each time mod_version bumps.
	changelog = """\
Utility Foci, journal UI, loot, and polish release.

- Added vanilla-friendly utility Foci including Anchor, Cinder, Forager, Galespur, Hearth, Lantern, Rainstep, Tremor, and Waystone.
- Added a custom Attunement Journal screen and generated journal book art, with expanded in-game guidance for Foci, attunement, Pacts, and progression.
- Expanded Lootr-friendly loot and wandering trader access so Focus rewards, shard fragments, and journals are easier to find through vanilla-style gameplay.
- Added pact challenge advancements plus clearer onboarding milestones for first Foci, dormant Foci, Discord, and pact challenges.
- Improved altar, pact, dormant Focus, and attunement readout feedback so capacity, binding, and state changes are easier to understand in-game.
- Unified Focus item art into the shared animated medallion style and made every Focus texture animation visibly move.
- Fixed Beacon and Waystone compass tracking so vanilla compasses can be redirected, named while active, and restored afterward.
- Added contract coverage for attunement sources, budget resolution, loot/trade data, altar behavior, journal UI, compass Focus behavior, and Focus data consistency.
"""
	uploadFile = file("build/libs/${project.name}-${project.version}.jar")
	gameVersions = ["26.1.2"]
	loaders = ["fabric"]
	dependencies {
		required.project "fabric-api"
	}
}

// `./gradlew modrinth` builds the remapped jar first, then uploads it.
tasks.named("modrinth") {
	dependsOn tasks.named("build")
}
