plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id 'com.modrinth.minotaur' version '2.+'
}

version = project.mod_version
group = project.maven_group

repositories {
	// Loom adds the Minecraft/Fabric repositories automatically; Maven Central
	// is declared here for ordinary library dependencies such as JUnit.
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"attuned" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// JUnit 5 — unit tests for the Minecraft-free logic (run by the `test` task).
	testImplementation platform("org.junit:junit-bom:5.11.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

test {
	useJUnitPlatform()
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

// Modrinth publishing. Run `./gradlew modrinth` with a MODRINTH_TOKEN environment
// variable set; the Modrinth project must already exist under the slug below.
modrinth {
	token = providers.environmentVariable("MODRINTH_TOKEN")
	projectId = "attuned-mod"
	versionNumber = project.version
	versionType = "release"
	versionName = "Attuned ${project.version}"
	// Changelog for the current release — refresh this each time mod_version bumps.
	changelog = """\
A polish pass on top of the Pacts Update.

- Apex capstone icons on the combat HUD: a red skull for Fury Execute, a gold shield for Bastion Unyielding, a cyan swirl for Zephyr Untouchable. The icons render through the GUI sprite atlas so they stay crisp at any HUD size and on any GUI scale.
- The Attunement Altar got a full visual rebuild: a solid-block 3D monument with affinity-themed crystals at the corners, animated runic plates per stance, and a 3D inventory render so the item icon matches what you place.
- The Altar GUI now opens reliably on empty-hand right-click. Fixed the interaction chain that was silently swallowing the click in 26.1.2, sized the click hitbox to match the new 3D model, and synced the player inventory grid layout so its slot wells render correctly under a texture-less screen.
- The Altar's Bind GUI shows a stance gem next to the affinity name so a player at Apex sees their Execute / Unyielding / Untouchable icon in the GUI too, not just in chat.
- Per-stance gem rendering in the Focus panel and the Altar GUI uses the same sprite path as the HUD, so all surfaces of the mod read as one design language.
- BlockItem display-name lang key wired so the Altar shows as "Attunement Altar" in tooltips instead of the raw translation key.
- Many smaller fixes: VoxelShape now mirrors the new altar model element for element, the corner-coord blit signature is documented in code, the HUD halo pulses on game-tick time so it freezes with a paused single-player game, and the Focus panel's idle glow does too.
"""
	uploadFile = file("build/libs/${project.name}-${project.version}.jar")
	gameVersions = ["26.1.2"]
	loaders = ["fabric"]
	dependencies {
		required.project "fabric-api"
	}
}

// `./gradlew modrinth` builds the remapped jar first, then uploads it.
tasks.named("modrinth") {
	dependsOn tasks.named("build")
}
