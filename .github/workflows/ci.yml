name: CI

on:
  push:
    branches: [latest]
  pull_request:
    branches: [latest]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          lfs: true

      - name: Resolve Minecraft version profile
        id: versions
        run: python3 tools/minecraft_version_profile.py current --github-output "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: ${{ steps.versions.outputs.java_version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e

      - name: Check whitespace
        run: git diff --check

      - name: Run repository checks
        run: python3 tools/verify_repository.py

      - name: Run Python tests
        run: python3 -m unittest discover -s tests

      - name: Run Gradle build
        run: ./gradlew test build --no-daemon

      - name: Run Minecraft server smoke check
        run: python3 tools/minecraft_runtime_smoke.py --accept-eula --timeout 240 --stop-timeout 60
