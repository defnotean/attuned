# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Quilt Properties
# check these against the official Quilt template and Maven metadata
minecraft_version=26.1.2
quilt_loader_version=0.30.0-beta.8
# Fabric Loom/Loader are retained as the build toolchain because Quilt Loom's
# latest release (1.15.1) cannot process unobfuscated Minecraft 26.x versions.
loader_version=0.19.3
loom_version=1.17.11
java_version=25

# Mod Properties
mod_version=1.5.6+mc26.1.2
maven_group=dev.attuned

# Dependencies
fabric_api_version=0.152.1+26.1.2
